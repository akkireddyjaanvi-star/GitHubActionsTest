name: development->staging->production
on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  development:
    runs-on: ubuntu-latest
    
    environment:
      name: development
      url: https://development.example.com

    steps:
      - name: Development Step
        run: |
          echo "Deploying to Development Environment"
          echo "==============================="
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Image tag: $IMAGE_TAG"
          echo "==============================="


  staging:
    runs-on: ubuntu-latest
    needs: development
    
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Staging Step
        run: |
          echo "Deploying to Staging Environment"
          echo "==============================="
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Image tag: $IMAGE_TAG"
          echo "==============================="

  production:
    runs-on: ubuntu-latest
    needs: staging
    
    environment:
      name: production
      url: https://production.example.com 

    steps:
      - name: Production Step
        run: |
          echo "Deploying to Production Environment"
          echo "==============================="
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Image tag: $IMAGE_TAG"
          echo "==============================="


  Deployment_Summary:
    runs-on: ubuntu-latest
    needs: [development, staging, production]
    if: always()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | URL                             | Image Tag | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "===========================================================================================================" >> "$GITHUB_STEP_SUMMARY"
          echo "| Development | https://development.example.com | \`$IMAGE_TAG\` | ${{ needs.development.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Staging | https://staging.example.com | \`$IMAGE_TAG\` | ${{ needs.staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production | https://production.example.com | \`$IMAGE_TAG\` | ${{ needs.production.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "============================================================================================================" >> "$GITHUB_STEP_SUMMARY"