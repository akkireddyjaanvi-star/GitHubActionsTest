name: Job Dependency Workflow
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: Build
              run: |
               echo "Building the application..."
               sleep 10
               echo "Building the application successfully"

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Test Job
              run: |
               echo "Run tests..."
               sleep 10
                echo "Tests completed successfully"
               
    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Deploy application
              run : |
               echo "Deployed the application"
               sleep 10
               echo "Application deployed successfully"
